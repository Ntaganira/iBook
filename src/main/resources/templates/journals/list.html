<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{je.title}, ~{::content})}">

<head></head>

<body>
<main th:fragment="content">

    <div th:replace="~{layout/common :: flash}"></div>

    <nav class="breadcrumb" th:aria-label="#{common.ariaBreadcrumb}">
        <a th:href="@{/}" th:text="#{nav.dashboard}">Dashboard</a>
        <svg class="ebook-icon ebook-icon--sm sep"><use href="#icon-chevron-right"/></svg>
        <span class="current" th:text="#{je.title}">Journal entries</span>
    </nav>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{je.title}">Journal entries</h1>
            <p class="page-subtitle" th:text="#{je.subtitle}">General ledger entries. Totals must balance.</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-ghost" th:href="@{/accounting/ledger}" th:text="#{led.title}">Ledger</a>
            <a class="btn btn-primary" th:href="@{/journals/new}">
                <svg class="ebook-icon"><use href="#icon-plus"/></svg>
                <span th:text="#{je.newEntry}">New entry</span>
            </a>
        </div>
    </div>

    <div class="card">
        <form class="table-toolbar" method="get" th:action="@{/journals}">
            <div class="toolbar-search">
                <svg class="ebook-icon"><use href="#icon-search"/></svg>
                <input type="text" name="q" th:value="${q}" th:placeholder="#{je.searchPlaceholder}">
            </div>
            <div class="toolbar-spacer"></div>
        </form>

        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th th:replace="~{layout/common :: thSort(${basePath + filterQuery}, 'entryDate', #{je.transactionDate}, ${sort}, ${dir})}">Date</th>
                        <th th:replace="~{layout/common :: thSort(${basePath + filterQuery}, 'entryNo', #{je.entryNo}, ${sort}, ${dir})}">Entry no</th>
                        <th th:replace="~{layout/common :: thSort(${basePath + filterQuery}, 'reference', #{je.reference}, ${sort}, ${dir})}">Reference</th>
                        <th th:text="#{je.memo}">Memo</th>
                        <th th:replace="~{layout/common :: thSort(${basePath + filterQuery}, 'status', #{common.status}, ${sort}, ${dir})}">Status</th>
                        <th class="num" th:text="#{je.amount}">Debit</th>
                        <th class="num" th:text="#{je.credit}">Credit</th>
                        <th class="actions-cell" th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${entries.content}">
                        <td class="cell-secondary" th:text="${e.entryDate != null ? #temporals.format(e.entryDate, 'dd MMM yyyy') : '—'}">07 Sep 2026</td>
                        <td>
                            <span class="cell-primary font-mono text-xs">
                                <a th:href="@{/journals/{id}(id=${e.id})}" th:text="${e.entryNo}">JE-2026-00001</a>
                            </span>
                        </td>
                        <td class="cell-secondary" th:text="${e.reference != null ? e.reference : '—'}">INV-001</td>
                        <td class="cell-secondary" th:text="${e.memo != null ? e.memo : '—'}">July rent accrual</td>
                        <td>
                            <span class="badge badge-success" th:if="${e.status.name() == 'POSTED'}" th:text="#{common.status.posted}">Posted</span>
                            <span class="badge badge-muted" th:unless="${e.status.name() == 'POSTED'}" th:text="#{common.status.draft}">Draft</span>
                        </td>
                        <td class="num" th:text="${baseCurrency + ' ' + #numbers.formatDecimal(e.totalDebits != null ? e.totalDebits : 0, 1, 0, 'COMMA')}">RWF 0</td>
                        <td class="num" th:text="${baseCurrency + ' ' + #numbers.formatDecimal(e.totalCredits != null ? e.totalCredits : 0, 1, 0, 'COMMA')}">RWF 0</td>
                        <td class="actions-cell">
                            <div class="row-actions dropdown">
                                <button class="row-actions-btn" type="button" data-dropdown-toggle><svg class="ebook-icon"><use href="#icon-more-horizontal"/></svg></button>
                                <div class="dropdown-menu">
                                    <a class="dropdown-item" th:href="@{/journals/{id}(id=${e.id})}"><svg class="ebook-icon"><use href="#icon-search"/></svg><span th:text="#{common.view}">View</span></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(entries.content)}">
                        <td class="table-empty" colspan="8">
                            <div class="empty-state">
                                <div class="empty-state-icon"><svg class="ebook-icon"><use href="#icon-book"/></svg></div>
                                <p class="text-secondary" th:text="#{je.none}">No journal entries yet.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="table-footer" th:if="${entries.totalPages > 1}">
            <span th:text="#{set.records(${entries.totalElements})}">12 records</span>
            <div th:replace="~{layout/pagination :: pagination(${entries.number + 1}, ${entries.totalPages},
                 ${basePath + filterQuery + (#strings.contains(filterQuery, '?') ? '&' : '?') + 'sort=' + sort + '&dir=' + dir})}"></div>
        </div>
    </div>

</main>
</body>
</html>
