<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{set.invoiceTemplates.form.title}, ~{::content})}">

<head></head>

<body>
<main th:fragment="content">

    <nav class="breadcrumb" th:aria-label="#{common.ariaBreadcrumb}">
        <a th:href="@{/settings/invoice-templates}" th:text="#{set.invoiceTemplates.title}">Invoice templates</a>
        <svg class="ebook-icon ebook-icon--sm sep"><use href="#icon-chevron-right"/></svg>
        <span class="current" th:if="${mode == 'edit'}" th:text="#{set.invoiceTemplates.edit.title}">Edit template</span>
        <span class="current" th:unless="${mode == 'edit'}" th:text="#{set.invoiceTemplates.new.title}">New template</span>
    </nav>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:if="${mode == 'edit'}" th:text="#{set.invoiceTemplates.edit.title}">Edit template</h1>
            <h1 class="page-title" th:unless="${mode == 'edit'}" th:text="#{set.invoiceTemplates.new.title}">New template</h1>
            <p class="page-subtitle" th:text="#{set.invoiceTemplates.form.subtitle}">The look and layout used when printing invoices.</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-ghost" th:href="@{/settings/invoice-templates}" th:text="#{common.cancel}">Cancel</a>
            <button class="btn btn-primary" type="submit" form="invoiceTemplateForm">
                <svg class="ebook-icon"><use href="#icon-check"/></svg>
                <span th:if="${mode == 'edit'}" th:text="#{set.template.save}">Save changes</span>
                <span th:unless="${mode == 'edit'}" th:text="#{set.template.create}">Create template</span>
            </button>
        </div>
    </div>

    <form id="invoiceTemplateForm" th:action="${mode == 'edit'} ? @{/settings/invoice-templates/{id}(id=${editingId})} : @{/settings/invoice-templates}"
          th:object="${form}" method="post" novalidate>

        <div class="grid grid-12">
            <div class="col-span-8 d-flex flex-column gap-5">
                <section class="section">
                    <div class="section-header">
                        <div>
                            <h3 th:text="#{set.invoiceTemplates.basic}">Template information</h3>
                            <div class="card-subtitle" th:text="#{set.invoiceTemplates.basicHint}">Give the template a name you will recognise.</div>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label" for="tplName"><span th:text="#{set.template.name}">Template name</span> <span class="required">*</span></label>
                                <input class="form-control" id="tplName" name="name" type="text" th:value="${form.name}"
                                       th:placeholder="#{set.invoiceTemplates.namePlaceholder}" required autofocus>
                                <div th:replace="~{layout/common :: fieldError('name')}"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="tplLayout"><span th:text="#{set.template.layout}">Layout</span> <span class="required">*</span></label>
                                <select class="form-control" id="tplLayout" name="layout" required>
                                    <option value="modern" th:selected="${form.layout == 'modern'}">Modern</option>
                                    <option value="classic" th:selected="${form.layout == 'classic'}">Classic</option>
                                    <option value="simple" th:selected="${form.layout == 'simple'}">Simple</option>
                                    <option value="compact" th:selected="${form.layout == 'compact'}">Compact</option>
                                </select>
                                <div th:replace="~{layout/common :: fieldError('layout')}"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="tplPaper"><span th:text="#{set.template.paper}">Paper size</span> <span class="required">*</span></label>
                                <select class="form-control" id="tplPaper" name="paperSize" required>
                                    <option value="A4" th:selected="${form.paperSize == 'A4'}">A4</option>
                                    <option value="Letter" th:selected="${form.paperSize == 'Letter'}">US Letter</option>
                                </select>
                                <div th:replace="~{layout/common :: fieldError('paperSize')}"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="tplAccent" th:text="#{set.template.accent}">Accent colour</label>
                                <div class="d-flex gap-2 align-center">
                                    <input class="form-control form-control--color" id="tplAccent" name="accentColor" type="color" th:value="${form.accentColor}">
                                    <span class="text-sm font-mono text-secondary" th:text="${form.accentColor}">#166534</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="section">
                    <div class="section-header">
                        <h3 th:text="#{set.invoiceTemplates.content}">Document content</h3>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <input type="hidden" name="showsLogo" value="false"><label class="checkbox form-option"><input type="checkbox" name="showsLogo" th:checked="${form.showsLogo}"><span class="checkbox-box"></span><span th:text="#{set.invoiceTemplates.showsLogo}">Show company logo</span></label>
                            <input type="hidden" name="showsTaxSummary" value="false"><label class="checkbox form-option"><input type="checkbox" name="showsTaxSummary" th:checked="${form.showsTaxSummary}"><span class="checkbox-box"></span><span th:text="#{set.invoiceTemplates.showsTaxSummary}">Show tax summary</span></label>
                            <input type="hidden" name="includesTerms" value="false"><label class="checkbox form-option"><input type="checkbox" name="includesTerms" th:checked="${form.includesTerms}"><span class="checkbox-box"></span><span th:text="#{set.invoiceTemplates.includesTerms}">Include payment terms</span></label>
                        </div>
                    </div>
                </section>

                <section class="section">
                    <div class="section-header">
                        <h3 th:text="#{set.invoiceTemplates.preferences}">Preferences</h3>
                    </div>
                    <div class="section-body">
                        <label class="switch">
                            <input type="hidden" name="defaultTemplate" value="false">
                            <input type="checkbox" name="defaultTemplate" th:checked="${form.defaultTemplate}">
                            <span class="switch-track"></span>
                            <span class="switch-label" th:text="#{set.template.defaultLabel}">Use as default template</span>
                        </label>
                        <div class="form-hint" th:text="#{set.invoiceTemplates.defaultHint}">Used when printing invoices that have no template assigned.</div>
                        <hr style="margin:var(--sp-4) 0">
                        <label class="switch">
                            <input type="hidden" name="active" value="false">
                            <input type="checkbox" name="active" th:checked="${form.active}">
                            <span class="switch-track"></span>
                            <span class="switch-label" th:text="#{set.invoiceTemplates.isActive}">Template is active</span>
                        </label>
                    </div>
                </section>
            </div>
        </div>
    </form>

</main>
</body>
</html>
