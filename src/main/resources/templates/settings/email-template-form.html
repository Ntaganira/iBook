<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{set.emailTemplates.form.title}, ~{::content})}">

<head></head>

<body>
<main th:fragment="content">

    <nav class="breadcrumb" th:aria-label="#{common.ariaBreadcrumb}">
        <a th:href="@{/settings/email-templates}" th:text="#{set.emailTemplates.title}">Email templates</a>
        <svg class="ebook-icon ebook-icon--sm sep"><use href="#icon-chevron-right"/></svg>
        <span class="current" th:if="${mode == 'edit'}" th:text="#{set.emailTemplates.edit.title}">Edit template</span>
        <span class="current" th:unless="${mode == 'edit'}" th:text="#{set.emailTemplates.new.title}">New template</span>
    </nav>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:if="${mode == 'edit'}" th:text="#{set.emailTemplates.edit.title}">Edit template</h1>
            <h1 class="page-title" th:unless="${mode == 'edit'}" th:text="#{set.emailTemplates.new.title}">New template</h1>
            <p class="page-subtitle" th:text="#{set.emailTemplates.form.subtitle}">Messages sent to customers, vendors and staff.</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-ghost" th:href="@{/settings/email-templates}" th:text="#{common.cancel}">Cancel</a>
            <button class="btn btn-primary" type="submit" form="emailTemplateForm">
                <svg class="ebook-icon"><use href="#icon-check"/></svg>
                <span th:if="${mode == 'edit'}" th:text="#{set.template.save}">Save changes</span>
                <span th:unless="${mode == 'edit'}" th:text="#{set.template.create}">Create template</span>
            </button>
        </div>
    </div>

    <form id="emailTemplateForm" th:action="${mode == 'edit'} ? @{/settings/email-templates/{id}(id=${editingId})} : @{/settings/email-templates}"
          th:object="${form}" method="post" novalidate>

        <div class="grid grid-12">
            <div class="col-span-8 d-flex flex-column gap-5">
                <section class="section">
                    <div class="section-header">
                        <div>
                            <h3 th:text="#{set.emailTemplates.basic}">Template information</h3>
                            <div class="card-subtitle" th:text="#{set.emailTemplates.basicHint}">The code is used by the system to select this template.</div>
                        </div>
                    </div>
                    <div class="section-body">
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label" for="etTemplateCode"><span th:text="#{set.template.code}">Code</span> <span class="required">*</span></label>
                                <input class="form-control font-mono" id="etTemplateCode" name="code" type="text" th:value="${form.code}"
                                       th:placeholder="#{set.emailTemplates.codePlaceholder}" th:readonly="${mode == 'edit'}" required>
                                <div class="form-hint" th:text="#{set.emailTemplates.codeHint}">Lowercase letters, numbers, dots, dashes or underscores.</div>
                                <div th:replace="~{layout/common :: fieldError('code')}"></div>
                            </div>
                            <div class="form-group col-span-2">
                                <label class="form-label" for="etTemplateName"><span th:text="#{set.template.name}">Template name</span> <span class="required">*</span></label>
                                <input class="form-control" id="etTemplateName" name="name" type="text" th:value="${form.name}"
                                       th:placeholder="#{set.emailTemplates.namePlaceholder}" required>
                                <div th:replace="~{layout/common :: fieldError('name')}"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="etTemplateSubject"><span th:text="#{set.template.subject}">Subject line</span> <span class="required">*</span></label>
                                <input class="form-control" id="etTemplateSubject" name="subject" type="text" th:value="${form.subject}"
                                       th:placeholder="#{set.emailTemplates.subjectPlaceholder}" required>
                                <div th:replace="~{layout/common :: fieldError('subject')}"></div>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="etTemplateType"><span th:text="#{set.template.type}">Content type</span> <span class="required">*</span></label>
                                <select class="form-control" id="etTemplateType" name="contentType" required>
                                    <option value="html" th:selected="${form.contentType == 'html'}">HTML</option>
                                    <option value="text" th:selected="${form.contentType == 'text'}">Plain text</option>
                                </select>
                                <div th:replace="~{layout/common :: fieldError('contentType')}"></div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="section">
                    <div class="section-header">
                        <h3 th:text="#{set.emailTemplates.body}">Message body</h3>
                    </div>
                    <div class="section-body">
                        <div class="form-group">
                            <label class="form-label" for="etTemplateBody" th:text="#{set.emailTemplates.bodyHint}">Hello {customerName},</label>
                            <textarea class="form-control form-control--textarea" id="etTemplateBody" name="body" rows="8" th:text="${form.body}"
                                      th:placeholder="#{set.emailTemplates.bodyPlaceholder}"></textarea>
                        </div>
                    </div>
                </section>

                <section class="section">
                    <div class="section-header">
                        <h3 th:text="#{set.emailTemplates.preferences}">Preferences</h3>
                    </div>
                    <div class="section-body">
                        <label class="switch">
                            <input type="hidden" name="active" value="false">
                            <input type="checkbox" name="active" th:checked="${form.active}">
                            <span class="switch-track"></span>
                            <span class="switch-label" th:text="#{set.emailTemplates.isActive}">Template is active</span>
                        </label>
                    </div>
                </section>
            </div>
        </div>
    </form>

</main>
</body>
</html>
