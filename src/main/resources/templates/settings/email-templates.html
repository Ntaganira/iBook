<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{set.emailTemplates.title}, ~{::content})}">

<head></head>

<body>
<main th:fragment="content">

    <nav class="breadcrumb" th:aria-label="#{common.ariaBreadcrumb}">
        <a th:href="@{/settings}" th:text="#{set.breadcrumb}">System Settings</a>
        <svg class="ebook-icon ebook-icon--sm sep"><use href="#icon-chevron-right"/></svg>
        <span class="current" th:text="#{set.emailTemplates.title}">Email Templates</span>
    </nav>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{set.emailTemplates.title}">Email Templates</h1>
            <p class="page-subtitle" th:text="#{set.emailTemplates.subtitle}">Messages sent to customers, vendors and staff.</p>
        </div>
        <div class="page-actions">
            <a class="btn btn-primary" th:href="@{/settings/email-templates/new}">
                <svg class="ebook-icon"><use href="#icon-plus"/></svg>
                <span th:text="#{set.emailTemplates.new}">New template</span>
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th th:replace="~{layout/common :: thSort(${basePath + filterQuery}, 'name', #{set.template.name}, ${sort}, ${dir})}">Template</th>
                        <th th:replace="~{layout/common :: thSort(${basePath + filterQuery}, 'code', #{set.template.code}, ${sort}, ${dir})}">Code</th>
                        <th th:text="#{set.template.subject}">Subject</th>
                        <th th:replace="~{layout/common :: thSort(${basePath + filterQuery}, 'contentType', #{set.template.type}, ${sort}, ${dir})}">Type</th>
                        <th th:replace="~{layout/common :: thSort(${basePath + filterQuery}, 'active', #{common.status}, ${sort}, ${dir})}">Status</th>
                        <th class="actions-cell" th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${templates.content}">
                        <td class="fw-600" th:text="${t.name}">Invoice sent</td>
                        <td><span class="badge badge-neutral font-mono" th:text="${t.code}">invoice_sent</span></td>
                        <td class="cell-secondary" th:text="${t.subject}">Your invoice is ready</td>
                        <td><span class="badge badge-neutral" th:text="${#strings.toUpperCase(t.contentType)}">HTML</span></td>
                        <td>
                            <span class="badge badge-success" th:if="${t.active}" th:text="#{common.status.active}">Active</span>
                            <span class="badge badge-muted" th:unless="${t.active}" th:text="#{common.status.inactive}">Inactive</span>
                        </td>
                        <td class="actions-cell">
                            <div class="row-actions dropdown">
                                <button class="row-actions-btn" type="button" data-dropdown-toggle><svg class="ebook-icon"><use href="#icon-more-horizontal"/></svg></button>
                                <div class="dropdown-menu">
                                    <a class="dropdown-item" th:href="@{/settings/email-templates/{id}/edit(id=${t.id})}"><svg class="ebook-icon"><use href="#icon-edit"/></svg><span th:text="#{common.edit}">Edit</span></a>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(templates.content)}">
                        <td class="table-empty" colspan="6">
                            <div class="empty-state">
                                <div class="empty-state-icon"><svg class="ebook-icon"><use href="#icon-mail"/></svg></div>
                                <p class="text-secondary" th:text="#{set.emailTemplates.none}">No email templates yet.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="table-footer" th:if="${templates.totalPages > 1}">
            <span th:text="#{set.records(${templates.totalElements})}">12 records</span>
            <div th:replace="~{layout/pagination :: pagination(${templates.number + 1}, ${templates.totalPages},
                 ${basePath + filterQuery + (#strings.contains(filterQuery, '?') ? '&' : '?') + 'sort=' + sort + '&dir=' + dir})}"></div>
        </div>
    </div>

</main>
</body>
</html>
