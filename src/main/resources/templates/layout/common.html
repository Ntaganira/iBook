<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>
<!-- Global element: flash toasts from server (thymeleaf flash attribute) + container -->
<div th:fragment="toasts">
    <div id="toastContainer"></div>
</div>

<!-- Sortable table header: url may carry an existing query string; sort/dir/page are appended. -->
<th th:fragment="thSort(url, field, label, sort, dir)"
    th:with="sortUrl=${url + (url.contains('?') ? '&' : '?') + 'sort=' + field + '&dir=' + (sort == field and dir == 'asc' ? 'desc' : 'asc') + '&page=0'}">
    <button class="th-sort" type="button" th:attr="data-sort-url=${sortUrl}"
            th:classappend="${sort == field ? 'active' : ''}">
        <span th:text="${label}">Column</span>
        <svg class="ebook-icon ebook-icon--sm" th:style="${sort == field and dir == 'desc'} ? 'transform: rotate(180deg)' : ''"><use href="#icon-chevron-down"/></svg>
    </button>
</th>

<!-- Sortable table header, right-aligned (numeric columns). -->
<th th:fragment="thSortNum(url, field, label, sort, dir)" class="num"
    th:with="sortUrl=${url + (url.contains('?') ? '&' : '?') + 'sort=' + field + '&dir=' + (sort == field and dir == 'asc' ? 'desc' : 'asc') + '&page=0'}">
    <button class="th-sort" type="button" th:attr="data-sort-url=${sortUrl}"
            th:classappend="${sort == field ? 'active' : ''}">
        <span th:text="${label}">Column</span>
        <svg class="ebook-icon ebook-icon--sm" th:style="${sort == field and dir == 'desc'} ? 'transform: rotate(180deg)' : ''"><use href="#icon-chevron-down"/></svg>
    </button>
</th>

<!-- KPI delta (dashboard cards): shows % change vs previous period or an em dash when not computable -->
<span th:fragment="kpiDelta(kpi)">
    <th:block th:if="${kpi.hasDelta and kpi.delta != null}">
        <span class="kpi-delta" th:classappend="${kpi.delta.signum() >= 0} ? 'up' : 'down'"
              th:style="${kpi.good} ? 'color:var(--success-700);background:var(--success-50)' : ''">
            <svg class="ebook-icon ebook-icon--sm">
                <use th:href="${kpi.delta.signum() >= 0} ? '#icon-arrow-up' : '#icon-arrow-down'"/>
            </svg>
            <span th:text="${#numbers.formatDecimal(kpi.delta, 1, 1, 'COMMA')}">12.4</span>%
        </span>
    </th:block>
    <span class="kpi-delta flat" th:unless="${kpi.hasDelta and kpi.delta != null}">—</span>
</span>

<!-- Field validation errors -->
<div th:fragment="fieldError(field)" th:if="${#fields.hasErrors(field)}">
    <div class="form-invalid-feedback" th:each="err : ${#fields.errors(field)}">
        <svg class="ebook-icon ebook-icon--sm"><use href="#icon-alert-circle"/></svg>
        <span th:text="${err}">Invalid value</span>
    </div>
</div>

<!-- Global flash message -->
<div th:fragment="flash">
    <th:block th:if="${flashMessage != null}">
        <div class="alert alert--success mb-4" th:classappend="${flashMessage.type != null ? 'alert--' + flashMessage.type : ''}">
            <svg class="ebook-icon"><use href="#icon-check-circle"/></svg>
            <div class="alert-body">
                <div class="alert-title" th:text="${flashMessage.title}">Saved</div>
                <div th:if="${flashMessage.detail != null}" th:text="${flashMessage.detail}">The record was saved successfully.</div>
            </div>
            <button class="alert-close" type="button" data-alert-dismiss th:aria-label="#{common.ariaClose}"><svg class="ebook-icon ebook-icon--sm"><use href="#icon-x"/></svg></button>
        </div>
    </th:block>
</div>
</body>
</html>
