<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(#{error.pageNotFound}, ~{::content})}">

<head></head>

<body>
<main th:fragment="content">

    <div class="error-page">
        <div class="error-code">404</div>
        <div class="d-flex align-items-center gap-2 mb-3">
            <svg class="ebook-icon" style="width:26px;height:26px"><use href="#icon-compass"/></svg>
            <span class="auth-eyebrow" style="color:var(--primary-600)" th:text="#{error.lost}">Lost your way</span>
        </div>
        <h1 class="error-title" th:text="#{error.pageNotFound}">Page not found</h1>
        <p class="error-desc" th:text="#{error.404.desc}">
            The page you're looking for doesn't exist or has been moved.
            Check the address, or head back to your dashboard.
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a class="btn btn-primary" th:href="@{/}">
                <svg class="ebook-icon"><use href="#icon-grid"/></svg>
                <span th:text="#{error.goDashboard}">Go to dashboard</span>
            </a>
            <button class="btn btn-secondary" type="button" onclick="window.history.back()">
                <svg class="ebook-icon"><use href="#icon-arrow-left"/></svg>
                <span th:text="#{error.goBack}">Go back</span>
            </button>
        </div>
        <div class="text-sm text-muted mt-8">
            <span th:text="#{error.needHelp}">Need help?</span>
            <a class="link" th:href="@{mailto:support@ebookonline.rw}">support@ebookonline.rw</a>
            · +250 788 401 220
        </div>
    </div>

</main>
</body>
</html>
