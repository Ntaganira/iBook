<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{reset.title}">Choose a new password — Ebook Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ebook.css}">
</head>

<body class="theme-root">
<div class="auth-page">

    <!-- Brand aside -->
    <aside class="auth-side">
        <div style="position:relative;z-index:1">
            <div class="d-flex align-items-center gap-2" style="filter:drop-shadow(0 2px 8px rgba(0,0,0,.18))">
                <div class="brand-logo"><svg class="ebook-icon ebook-icon--lg"><use href="#icon-logo"/></svg></div>
                <span class="brand-name" style="color:#fff" th:text="#{app.name}">Ebook Online</span>
            </div>
            <div class="auth-fi">
                <svg class="ebook-icon"><use href="#icon-feather"/></svg>
                <span th:text="#{auth.tagline}">Rwanda-first cloud accounting, EBM-ready out of the box</span>
            </div>
            <div class="auth-fi-stats">
                <div class="auth-fi-stat"><b>&gt;4,800</b><span th:text="#{auth.statBusinesses}">Rwanda businesses</span></div>
                <div class="auth-fi-stat"><b>18%</b><span th:text="#{auth.statVat}">VAT handled</span></div>
                <div class="auth-fi-stat"><b>2m+</b><span th:text="#{auth.statInvoices}">EBM e-invoices</span></div>
            </div>
        </div>
        <div class="auth-footer">
            <span th:text="#{auth.poweredBy('Ebook Online')}">Powered by Ebook Online</span>
            · <a href="#" class="link" style="color:inherit" th:text="#{auth.help}">Help</a>
        </div>
    </aside>

    <!-- Form main -->
    <main class="auth-main">
        <div class="auth-panel">

            <span class="auth-eyebrow" th:text="#{reset.eyebrow}">Security</span>
            <h1 class="auth-title" th:text="#{reset.title}">Choose a new password</h1>
            <p class="auth-desc" th:text="#{reset.desc}">Your new password must be at least 8 characters.</p>

            <form class="mt-8" th:action="@{/reset-password}" th:object="${resetPasswordForm}" method="post">
                <input type="hidden" name="token" th:value="${token}">

                <div class="alert alert--error mb-6" th:if="${#fields.hasGlobalErrors()}">
                    <svg class="ebook-icon"><use href="#icon-alert-triangle"/></svg>
                    <div class="alert-body">
                        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password" th:text="#{reset.password}">New password</label>
                    <div class="input-group">
                        <span class="input-prefix"><svg class="ebook-icon ebook-icon--sm"><use href="#icon-lock"/></svg></span>
                        <input class="form-control" id="password" type="password" th:field="*{password}" autocomplete="new-password"
                               th:placeholder="#{reset.passwordPlaceholder}" required autofocus>
                    </div>
                    <div th:replace="~{layout/common :: fieldError('password')}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword" th:text="#{reset.confirmPassword}">Confirm new password</label>
                    <div class="input-group">
                        <span class="input-prefix"><svg class="ebook-icon ebook-icon--sm"><use href="#icon-lock"/></svg></span>
                        <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}" autocomplete="new-password"
                               th:placeholder="#{reset.confirmPasswordPlaceholder}" required>
                    </div>
                    <div th:replace="~{layout/common :: fieldError('confirmPassword')}"></div>
                </div>

                <button class="btn btn-primary btn-block btn-lg" type="submit">
                    <span th:text="#{reset.submit}">Update password</span>
                    <svg class="ebook-icon"><use href="#icon-check"/></svg>
                </button>
            </form>

            <p class="text-sm text-center mt-8 mb-0 text-muted">
                <a class="link font-semibold" th:href="@{/login}">
                    <svg class="ebook-icon ebook-icon--sm" style="vertical-align:-2px"><use href="#icon-arrow-left"/></svg>
                    <span th:text="#{reset.backToLogin}">Back to sign in</span>
                </a>
            </p>
        </div>
    </main>
</div>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" th:replace="~{layout/icons :: sprite}"></svg>

<script th:src="@{/js/ebook.js}" defer></script>
</body>
</html>
