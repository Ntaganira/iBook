<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title}">Create your account — Ebook Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/ebook.css}">
</head>

<body class="theme-root">
<div class="auth-page">

    <!-- Brand aside -->
    <aside class="auth-side">
        <div style="position:relative;z-index:1">
            <div class="d-flex align-items-center gap-2" style="filter:drop-shadow(0 2px 8px rgba(0,0,0,.18))">
                <div class="brand-logo"><svg class="ebook-icon ebook-icon--lg"><use href="#icon-logo"/></svg></div>
                <span class="brand-name" style="color:#fff" th:text="#{app.name}">Ebook Online</span>
            </div>
            <div class="auth-fi">
                <svg class="ebook-icon"><use href="#icon-feather"/></svg>
                <span th:text="#{auth.tagline}">Rwanda-first cloud accounting, EBM-ready out of the box</span>
            </div>
            <div class="auth-fi-stats">
                <div class="auth-fi-stat"><b>&gt;4,800</b><span th:text="#{auth.statBusinesses}">Rwanda businesses</span></div>
                <div class="auth-fi-stat"><b>18%</b><span th:text="#{auth.statVat}">VAT handled</span></div>
                <div class="auth-fi-stat"><b>2m+</b><span th:text="#{auth.statInvoices}">EBM e-invoices</span></div>
            </div>
        </div>
        <div class="auth-footer">
            <span th:text="#{auth.poweredBy('Ebook Online')}">Powered by Ebook Online</span>
            · <a href="#" class="link" style="color:inherit" th:text="#{auth.help}">Help</a>
        </div>
    </aside>

    <!-- Form main -->
    <main class="auth-main">
        <div class="auth-panel">

            <div class="mb-6 d-flex justify-content-end d-md-none">
                <button class="btn btn-ghost btn-sm" type="button" data-theme-toggle>
                    <svg class="ebook-icon" data-theme-icon="dark"><use href="#icon-moon"/></svg>
                    <svg class="ebook-icon d-none" data-theme-icon="light"><use href="#icon-sun"/></svg>
                    <span th:text="#{auth.theme}">Theme</span>
                </button>
            </div>

            <span class="auth-eyebrow" th:text="#{register.eyebrow}">Get started</span>
            <h1 class="auth-title" th:text="#{register.title}">Create your account</h1>
            <p class="auth-desc" th:text="#{register.desc}">Start your free trial — no card required.</p>

            <form class="mt-8" th:action="@{/register}" th:object="${registerForm}" method="post">
                <div class="alert alert--error mb-6" th:if="${#fields.hasGlobalErrors()}">
                    <svg class="ebook-icon"><use href="#icon-alert-triangle"/></svg>
                    <div class="alert-body">
                        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
                    </div>
                </div>

                <div class="grid grid-2 gap-3">
                    <div class="form-group">
                        <label class="form-label" for="firstName" th:text="#{register.firstName}">First name</label>
                        <input class="form-control" id="firstName" type="text" th:field="*{firstName}"
                               th:placeholder="#{register.firstNamePlaceholder}" required autofocus>
                        <div th:replace="~{layout/common :: fieldError('firstName')}"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="lastName" th:text="#{register.lastName}">Last name</label>
                        <input class="form-control" id="lastName" type="text" th:field="*{lastName}"
                               th:placeholder="#{register.lastNamePlaceholder}" required>
                        <div th:replace="~{layout/common :: fieldError('lastName')}"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email" th:text="#{register.email}">Email address</label>
                    <div class="input-group">
                        <span class="input-prefix"><svg class="ebook-icon ebook-icon--sm"><use href="#icon-mail"/></svg></span>
                        <input class="form-control" id="email" type="email" th:field="*{email}"
                               th:placeholder="#{register.emailPlaceholder}" required>
                    </div>
                    <div th:replace="~{layout/common :: fieldError('email')}"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone" th:text="#{register.phone}">Phone (optional)</label>
                    <div class="input-group">
                        <span class="input-prefix"><svg class="ebook-icon ebook-icon--sm"><use href="#icon-phone"/></svg></span>
                        <input class="form-control" id="phone" type="tel" th:field="*{phone}"
                               th:placeholder="#{register.phonePlaceholder}">
                    </div>
                    <div th:replace="~{layout/common :: fieldError('phone')}"></div>
                </div>

                <div class="grid grid-2 gap-3">
                    <div class="form-group">
                        <label class="form-label" for="password" th:text="#{register.password}">Password</label>
                        <div class="input-group">
                            <span class="input-prefix"><svg class="ebook-icon ebook-icon--sm"><use href="#icon-lock"/></svg></span>
                            <input class="form-control" id="password" type="password" th:field="*{password}"
                                   th:placeholder="#{register.passwordPlaceholder}" autocomplete="new-password" required>
                        </div>
                        <div th:replace="~{layout/common :: fieldError('password')}"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="confirmPassword" th:text="#{register.confirmPassword}">Confirm password</label>
                        <div class="input-group">
                            <span class="input-prefix"><svg class="ebook-icon ebook-icon--sm"><use href="#icon-lock"/></svg></span>
                            <input class="form-control" id="confirmPassword" type="password" th:field="*{confirmPassword}"
                                   th:placeholder="#{register.confirmPasswordPlaceholder}" autocomplete="new-password" required>
                        </div>
                        <div th:replace="~{layout/common :: fieldError('confirmPassword')}"></div>
                    </div>
                </div>

                <button class="btn btn-primary btn-block btn-lg mt-6" type="submit">
                    <span th:text="#{register.submit}">Create account</span>
                    <svg class="ebook-icon"><use href="#icon-arrow-right"/></svg>
                </button>
            </form>

            <div class="d-flex align-items-center gap-3 my-6">
                <hr style="flex:1">
                <span class="text-xs text-muted" style="text-transform:uppercase;letter-spacing:.08em" th:text="#{auth.or}">or</span>
                <hr style="flex:1">
            </div>

            <div class="grid grid-2 gap-3">
                <button class="btn btn-secondary" type="button">
                    <svg class="ebook-icon ebook-icon--sm"><use href="#icon-phone"/></svg>
                    <span th:text="#{auth.signInPhone}">Sign in with phone</span>
                </button>
                <button class="btn btn-secondary" type="button">
                    <svg class="ebook-icon ebook-icon--sm"><use href="#icon-key"/></svg>
                    <span th:text="#{auth.signInCode}">Sign in with code</span>
                </button>
            </div>

            <p class="text-sm text-center mt-8 mb-0 text-muted">
                <span th:text="#{register.haveAccount}">Already have an account?</span>
                <a class="link font-semibold" th:href="@{/login}" th:text="#{register.signIn}">Sign in</a>
            </p>
        </div>
    </main>
</div>

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" th:replace="~{layout/icons :: sprite}"></svg>

<script th:src="@{/js/ebook.js}" defer></script>
</body>
</html>
