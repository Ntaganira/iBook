fc.cash.lagHint=A forecast says when a sale is earned, not when it is paid for, so the two lags above carry each month of trading into the month the money is expected to move. Everything already overdue is put in the first month rather than spread politely forward.
fc.cash.limitBehaviour=The two lags are one assumption applied to every customer and every supplier alike. Nothing here reads how any of them has actually paid in the past.
fc.cash.limitCapital=Only trading is projected. Buying an asset, taking or repaying a loan, drawings, tax payments and payroll outside the expense forecast are all absent.
fc.cash.limitCurrency=Invoice and bill balances are added up as they stand, without converting foreign currency. That is right for a single-currency ledger and wrong for any other.
fc.cash.limitVat=Forecast figures are net of VAT, because that is what reaches the profit and loss. Real receipts and payments carry VAT, so both columns understate the cash actually moving, and the VAT return itself is not scheduled here at all.
