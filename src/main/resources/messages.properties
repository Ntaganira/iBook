wht.owedToRra=Owed to the RRA.
wht.payableAccount=Withheld money is held in
wht.payableAccountHint=A liability, never an expense: it is the supplier's money held on the RRA's behalf, and it was never a cost of anything.
wht.rate=Rate
wht.rateApplied=Rate applied
wht.rateChoiceHint=Which rate applies is a judgement about the nature of the supply. Nothing here chooses for you.
wht.rateRequired=Choose the rate that applies
wht.rateSourcePlaceholder=RRA withholding schedule, read on…
wht.ratesHint=Which rate applies to a payment is a judgement about the supply, so it is chosen per certificate rather than inferred from the supplier.
wht.ratesTitle=The withholding rates
wht.registerLedgerHint=Issuing a certificate records the withheld amount against the bill as a payment whose destination is the withholding liability rather than a bank account. That is exactly what it is, and it keeps the bill's balance, the aging report and the payables total all agreeing with the ledger instead of being out by the amount withheld. Only bills can be withheld from: a direct expense is already paid in full, so there is nothing left to hold back.
wht.registerLedgerTitle=A part-payment of the bill, to the state instead of the supplier
wht.registerSubtitle=Tax withheld from supplier bills, and the certificates proving it.
wht.registerTitle=Withholding Certificates
wht.remit=Record the payment
wht.remitAmountHint=Prefilled with what the liability account still holds, and editable — what was actually declared and paid is what belongs here.
wht.remitHint=Debits the liability and credits the account the money left.
wht.remitLedgerHint=There is no separate record of remittances: the liability account is the record, so what has been handed over is read from the ledger rather than from a second tally that could disagree with it.
wht.remitTitle=Hand it over
wht.remitted=Payment recorded
wht.remittedInPeriod=Handed over in the period
