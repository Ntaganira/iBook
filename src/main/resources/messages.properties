fc.methodHint.average=Every month gets the plain average of the months of history above. It has no shape to it, which is exactly right for a trade that does not have one.
fc.methodHint.budget=Copies an existing budget straight across. Figures are lined up by calendar month, so a budget starting in July lands correctly in a forecast starting in January, and anything the budget does not cover comes out at zero.
fc.methodHint.manual=Nothing is worked out. The accounts and their history are laid out and every figure is yours to type.
fc.methodHint.seasonal=Each month repeats what the same calendar month did a year ago, so a trade with a season keeps its shape. It needs a full year of history to say anything.
fc.methodHint.trend=A straight line is fitted through the months of history and carried forward. A short or noisy history makes a confident line out of very little, so read the figures before trusting them.
