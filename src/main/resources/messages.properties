wht.form.title=Withhold From a Bill
wht.gateHint=The rates below are a starting point, not an authority. Withholding takes money off a supplier's payment and owes it to the state, so a wrong rate shorts either the supplier or the RRA — and both find out eventually. Check them against the current RRA schedule and confirm them here.
wht.gateTitle=Nothing is withheld until these rates are confirmed
wht.issue=Issue it
wht.issueHint=Issuing records the withheld amount against the bill as a payment to the withholding liability, so the supplier is then shown as owed that much less. It can be withheld only once per bill, and never more than the bill still owes.
wht.issued=Certificate issued
wht.issuedCount=Certificates issued
wht.ledgerHint=The whole of the bill is still the company's expense; part of it is simply paid to the RRA rather than to the supplier. So issuing a certificate posts a debit to accounts payable and a credit to the withholding liability, and touches no expense account — it moves a debt from one creditor to another. It is recorded as a part-payment of the bill, which is what keeps the bill's balance, the aging report and the payables total all saying the same thing.
wht.ledgerTitle=Withholding is not a cost
wht.liability=Still held
wht.liabilityHint=Read from the liability account itself.
wht.missingAccountHint=These codes are not in the chart of accounts: {0}. Add them there, or point the field below at an account that already exists.
wht.missingAccountTitle=The chart of accounts is missing the code this module expects
wht.negative=An amount cannot be negative
