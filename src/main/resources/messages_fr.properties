int.nothingTransmittedTitle=Rien n'est envoyé et rien n'est reçu
int.nothingTransmittedHint=Cette application n'a aucune connexion sortante : ni client, ni interrogation planifiée, ni adresse qu'un prestataire pourrait rappeler. Remplir cette page enregistre les paramètres dont une connexion aurait besoin. Elle n'en crée aucune, et rien de ce qui est saisi ici n'atteindra le prestataire.
