exc.ledgerHint=L'accise fait partie de la valeur sur laquelle la TVA est ensuite calculée : sur une ligne de facture, le droit est donc ajouté au montant hors taxe d'abord, et la TVA est calculée sur la somme. Calculer les deux sur le hors taxe sous-estimerait la TVA ; calculer l'accise sur le montant TVA comprise surestimerait le droit. Le droit est crédité à une dette et jamais aux produits — l'entreprise le perçoit du client pour le compte de l'État et il n'a jamais été le sien à gagner, de sorte que le chiffre d'affaires n'est pas affecté. Un droit est rattaché aux articles, car l'accise porte sur des biens particuliers et non sur le commerce en général.
