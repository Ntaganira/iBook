int.secretsHint=Il n'y a ni champ pour une clé ni colonne pour la stocker. Ce qui est enregistré est le nom de la variable d'environnement qui la contient, par exemple MOMO_API_KEY. Le nom n'est pas sensible ; la clé elle-même n'atteint jamais cette base, ses sauvegardes, ni aucune page. Le prix à payer est réel : quelqu'un doit définir la variable sur le serveur, et cette application ne peut pas lui dire si c'est correct, puisqu'elle ne lit jamais la valeur.
