fca.absError=Erreur absolue
fca.actual=Réel
fca.asOf=Évaluer au
fca.bias=Biais
fca.byMethodHint=Sur toutes les prévisions validées qui l'ont utilisée.
fca.byMethodTitle=Comment chaque méthode s'est comportée
fca.closest=La plus proche à ce jour
fca.difference=Écart
fca.forecast=Prévu
fca.forecastsScored=Prévisions
fca.method=Méthode
fca.methodHint=Seuls les mois terminés sont évalués — un mois en cours n'a que des réalisations partielles, et comparer la prévision d'un mois entier à un demi-mois de grand livre présenterait toutes les prévisions comme follement optimistes. Seules les prévisions validées sont évaluées, car un brouillon n'a jamais servi de référence. Les réalisations sont lues par la même définition que le compte de résultat, de sorte qu'une prévision ne peut pas être évaluée contre un montant qui contredirait les rapports.
fca.methodTitle=Comment l'évaluation fonctionne
fca.month=Mois
fca.monthsCount={0} mois évalués
fca.monthsScored=Mois
fca.noModelHint=La barre latérale appelle cette page prévisions IA. Elle ne l'est pas : appeler de l'arithmétique de l'IA serait une affirmation sur la manière dont les chiffres ont été produits, et une affirmation fausse. Ce que la page fait réellement, c'est noter cette arithmétique — ce qui rendrait un modèle utile à ajouter plus tard.
fca.noModelTitle=Rien ici n'est modélisé ni appris
fca.noWinnerHint=Une seule méthode a été évaluée : il n'y a rien à quoi la comparer. Rien n'est désigné comme le plus proche parmi un seul.
fca.none=Aucune prévision n'a encore de mois terminé à évaluer.
fca.noneHint=Publiez une prévision, laissez un mois passer, et elle sera évaluée ici contre ce que le grand livre a réellement fait. Les brouillons ne sont jamais évalués, car personne ne s'y est fié.
fca.perForecastHint=Seuls les mois terminés apparaissent.
fca.perForecastTitle=Chaque prévision, mois par mois
fca.rescore=Réévaluer
fca.scoredTo=Évalué jusqu''au {0}
fca.subtitle=À quel point chaque prévision s'est avérée juste, et quelle méthode fait mieux.
fca.title=Précision des Prévisions
fca.toExpense=Prévision de dépenses
fca.toRevenue=Prévision de recettes
fca.tooEarlyHint=Aucun de leurs mois n'est encore terminé : il n'y a rien d'honnête à en dire.
fca.tooEarlyTitle=Certaines prévisions sont trop récentes pour être évaluées
fca.twoMeasuresHint=Le biais est l'écart signé : il dit si une méthode surestime ou sous-estime, ce qui compte pour planifier. L'erreur absolue ignore le sens : elle dit de combien les chiffres étaient faux, mois par mois. Une méthode follement fausse dans les deux sens peut avoir presque aucun biais tout en étant inutile ; ne rapporter que le biais masquerait exactement cela.
fca.twoMeasuresTitle=Pourquoi il y a deux mesures
fca.winnerHint=La plus proche est celle dont l'erreur absolue est la plus faible en part du montant prévu. C'est un relevé de ce qui s'est passé jusqu'ici, sur le nombre de mois disponibles — pas une prédiction qu'elle restera la plus proche.

