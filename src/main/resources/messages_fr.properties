fc.cash.limitVat=Les chiffres prévus sont hors TVA, car c'est ce qui arrive au compte de résultat. Les encaissements et décaissements réels portent la TVA : les deux colonnes sous-estiment donc la trésorerie qui bouge vraiment, et la déclaration de TVA elle-même n'est pas planifiée ici.
