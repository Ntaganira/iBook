# ----- EBM readiness (ebm.*) -----
ebm.title=Préparation EBM
ebm.subtitle=Quelles factures émises contiennent tout ce qu'EBM exigerait, et ce qui manque aux autres.
ebm.toSettings=Paramètres EBM
ebm.notFiscalisedTitle=Aucune facture ici n'est fiscalisée
ebm.notFiscalisedHint=Une facture est fiscalisée lorsque le dispositif de signature de la RRA l'a signée et a renvoyé un reçu. Rien dans cette application n'envoie une facture où que ce soit : aucune n'a été signée et aucune ne porte de reçu. Cette page ne rend compte que de la préparation : si une facture contient les données qu'EBM exigerait. Lire « prête » comme « déclarée » est la seule erreur qui compterait ici, car elle produirait un faux registre légal pour celui qui devra plus tard répondre de la déclaration.
ebm.whyUsefulTitle=Pourquoi le faire avant la certification
ebm.whyUsefulHint=EBM rejette une facture pour données manquantes une facture à la fois, après la certification — moment où les factures sont déjà émises et où il faut courir après les manques auprès de clients partis ailleurs. Les manques sont les mêmes quelle que soit la façon dont l'intégration sera construite : les combler maintenant n'est pas du travail perdu.
ebm.structuralTitle=Un manque ne se corrige pas en modifiant les factures
ebm.structuralHint=EBM exige un code de classification d'article de la RRA sur chaque ligne, et il n'existe nulle part de champ pour cela sur un article. Un SKU est le code propre de l'entreprise et n'est pas la même chose. Ce manque n'est pas compté contre les factures ci-dessous, car aucune modification de celles-ci ne le comblerait : il faut un champ sur l'article et la liste de codes de la RRA.
ebm.noSellerTinTitle=Aucun NIF n'est enregistré pour l'entreprise
ebm.noSellerTinHint=Chaque facture ci-dessous manque du NIF du vendeur pour la même raison : le nombre de factures incomplètes n'est en réalité qu'un seul problème répété. Enregistrez-le une fois dans les paramètres de l'entreprise et la plupart se régleront d'un coup.
ebm.kpiIssued=Factures émises
ebm.kpiIssuedHint=Les brouillons sont exclus. Une facture annulée est conservée, car une facture émise doit encore être justifiée.
ebm.kpiComplete=Contiennent tous les champs requis
ebm.kpiCompleteHint=Prêtes à être préparées — ni fiscalisées, ni déclarées.
ebm.kpiIncomplete=Il manque quelque chose
ebm.kpiIncompleteHint=EBM les rejetterait en l'état.
ebm.kpiFiscalised=Portent un reçu fiscal
ebm.kpiFiscalisedHint=Toujours aucune. Le champ existe sur une facture et rien dans cette application ne l'écrit jamais.
ebm.tableTitle=Toutes les factures émises
ebm.tableHint=Les plus récentes d'abord.
ebm.invoice=Facture
ebm.readiness=Préparation EBM
ebm.holdsEverything=Contient tous les champs requis
ebm.wouldBeRejected=Serait rejetée
ebm.none=Aucune facture n'a été émise sur cette période.
