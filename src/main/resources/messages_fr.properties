fed.ledgerHint=Les lignes arrivent non catégorisées et le restent jusqu'à ce que quelqu'un dise ce qu'elles sont, car une sortie pourrait être un loyer, un remboursement, un prélèvement de l'exploitant ou un vol, et seule une personne le sait. Rien n'est deviné : il n'y a pas de moteur de règles et rien n'apprend des décisions passées, car une mauvaise supposition qui se comptabilise en silence est pire qu'une ligne qui attend. Une ligne illisible est comptée et signalée plutôt qu'abandonnée, car un relevé qui aurait perdu trois lignes en silence se rapprocherait au mauvais montant sans rien pour l'expliquer.
