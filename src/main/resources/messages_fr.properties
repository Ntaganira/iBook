fed.columnsHint=Ce qui est recherché : une colonne dont le nom contient « date » ; une contenant description, libellé, détails ou mémo ; soit une seule colonne de montant, soit une paire nommant crédit et débit — ou entrées et sorties, ou dépôt et retrait. Une référence et un solde progressif sont utilisés s'ils sont présents. Les séparateurs de milliers, les symboles monétaires et les parenthèses pour les négatifs sont tous gérés, et 1,234.56 comme 1.234,56 sont comprises.
