fed.notConnectedHint=Rien ici ne se connecte à qui que ce soit. Un flux en direct exige des identifiants et un accord avec la banque, et ni l'un ni l'autre n'existe dans cette application — aucun solde ne se met à jour tout seul et aucune opération n'arrive sans que quelqu'un l'apporte. Ce qui existe, c'est le CSV que toute banque exporte, et le lire est ce qui rend possibles la catégorisation et le rapprochement.
