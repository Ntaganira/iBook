# ----- Payment requests (prq.*) -----
prq.title=Demandes de paiement
prq.subtitle=Qui a été invité à payer, pour quel montant, et comment on le lui a indiqué.
prq.toSettings=Paramètres de la passerelle
prq.noLinkTitle=Ce ne sont pas des liens de paiement
prq.noLinkHint=Un lien de paiement est émis par une passerelle, qui encaisse l'argent et rend compte. Il n'y a pas de passerelle ici : aucun lien n'est produit. Ce que fait cette page à la place, c'est composer les instructions de paiement et enregistrer qu'elles sont parties — la part dont la passerelle n'était jamais qu'une commodité. C'est vous qui les envoyez.
prq.notAPaymentTitle=Une demande n'est pas un paiement
prq.notAPaymentHint=Enregistrer une demande ne touche pas au grand livre, ne réduit pas ce que le client doit, et n'apparaît pas dans le solde de la facture. L'argent est enregistré quand un reçu est saisi sur la facture, pas avant. Le règlement est lu sur la facture chaque fois que cette page est ouverte : il ne peut donc pas s'écarter du grand livre.
prq.noChannelTitle=Aucun canal d'encaissement n'est configuré
prq.noChannelHint=Rien n'a été enregistré pour une passerelle, MTN MoMo ou Airtel Money : il n'y a aucun code marchand à proposer et le champ du destinataire doit être saisi à la main. En enregistrer un le remplirait pour vous. Cela n'encaisserait toujours rien.
prq.statOwing=Restant dû sur les factures émises
prq.statOwingHint=Émises, non annulées, non encore réglées.
prq.mixedCurrency=Plus d'une devise entre dans ce chiffre et l'addition se fait sans conversion : ce n'est donc pas un vrai total. Lisez les factures une par une.
prq.statNeverAsked=Jamais relancées
prq.statNeverAskedHint=Factures dues sans aucune demande. C'est la liste qu'il vaut la peine de traiter.
prq.statAwaiting=Demandées, en attente
prq.statAwaitingHint=Demandées sur cette période, non retirées, et la facture n'est toujours pas réglée.
prq.askTitle=Inviter un client à payer
prq.askHint=Compose le message et enregistre qu'il est parti. Il ne l'envoie pas.
