fed.whatItIs=Ce que c'est
fed.worklistLedgerHint=Choisir un compte écrit une seule écriture équilibrée — le compte bancaire contre le compte choisi, dans le sens où le relevé dit que l'argent est allé — et inscrit le numéro d'écriture sur la ligne pour que le même mouvement ne puisse pas être saisi deux fois. Mettre une ligne de côté enregistre que quelqu'un l'a examinée et a décidé qu'elle n'exigeait rien, en général parce que le mouvement est déjà dans les livres du côté facture ; c'est différent, et bien plus utile, qu'une ligne dont personne ne s'est jamais occupé. Rien n'est deviné pour vous.
